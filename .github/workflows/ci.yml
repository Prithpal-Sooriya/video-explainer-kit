name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Branding guard
        run: |
          status=0
          git grep -I -i -l -E 'm[e]t[a]m[a]sk' -- ':!LICENSE' ':!NOTICE' ':!.github/workflows/*' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::repo must stay unbranded; matches listed above"
            exit 1
          fi
          if [ "$status" -ge 2 ]; then
            echo "::error::branding guard itself failed (git grep status $status)"
            exit 1
          fi
      - name: Python tests (no audio stack)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Node render tests
        run: node tests/test.ts
      - name: Example dry-run
        run: node bin/explainer render example/example.timeline.ts --dry-run
      - name: Example layout check
        run: node bin/explainer render example/example.timeline.ts --check
      - name: Default theme drift check
        run: node bin/explainer tokens build --theme motion-engineering --check
